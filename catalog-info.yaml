apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: scanyr
  title: Image Metadata Collector
  description: Scheduled Kubernetes workload inventory collector that generates versioned image metadata reports for downstream security scanning.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  owner: "group:default/5xx"
  system: system:default/ClusterImageScanner
  lifecycle: experimental
  consumesApis:
    - api:default/image-metadata-collector-upload-contract
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: image-metadata-collector-upload-contract
  title: Image Metadata Collector Upload Contract
  description: HTTP upload contract for versioned image metadata collector reports.
spec:
  type: openapi
  lifecycle: experimental
  owner: "group:default/5xx"
  definition:
    $text: ./schema/image-metadata-collector-report.openapi.yaml
